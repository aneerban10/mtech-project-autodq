<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Dataset - AutoDQ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow p-4">
                <h3 class="text-center mb-4">Select Dataset</h3>
                <form method="POST">
                    <div class="mb-3">
                        <select class="form-select" name="dataset" required>
                            <option value="">-- Choose Dataset --</option>
                            <option value="kyc">KYC Data</option>
                            <option value="creditcard">Credit Card Data</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Next</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
