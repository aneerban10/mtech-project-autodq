<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sample Preview - AutoDQ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        .table-container {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <h3 class="mb-3">Sample Rows for {{ dataset.upper() }}</h3>
    <form method="POST" class="mb-3">
        <label>Number of Rows (max 100)</label>
        <input type="number" name="n_rows" class="form-control w-25" min="1" max="100" value="5">
        <button class="btn btn-success mt-2">Show Preview</button>
    </form>

    {% if data %}
    <div class="table-container border p-2 bg-white shadow-sm">
        {{ data | safe }}
    </div>
    {% endif %}

    <a href="{{ url_for('action_selection', dataset=dataset) }}" class="btn btn-secondary mt-3">Back</a>
</div>
</body>
</html>
