<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Search - AutoDQ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        .table-container {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <h3 class="mb-3">Search Customer in {{ dataset.upper() }}</h3>
    <form method="POST" class="mb-3">
        <div class="row">
            <div class="col-md-4">
                <input type="text" name="customer_id" class="form-control" placeholder="Customer ID">
            </div>
            <div class="col-md-6">
                <label>Select Columns:</label>
                <select name="columns" class="form-select" multiple>
                    {% for col in columns %}
                        <option value="{{ col }}">{{ col }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-success w-100">Search</button>
            </div>
        </div>
    </form>

    {% if table %}
    <div class="table-container border p-2 bg-white shadow-sm">
        {{ table | safe }}
    </div>
    {% endif %}

    <a href="{{ url_for('action_selection', dataset=dataset) }}" class="btn btn-secondary mt-3">Back</a>
</div>
</body>
</html>
