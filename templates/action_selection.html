<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Actions - AutoDQ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h3 class="text-center mb-4">Select Action for {{ dataset.upper() }} Data</h3>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="d-grid gap-3">
                <a href="{{ url_for('sample_preview', dataset=dataset) }}" class="btn btn-primary btn-lg">Sample Row Preview</a>
                <a href="{{ url_for('customer_search', dataset=dataset) }}" class="btn btn-info btn-lg">Customer Search</a>
                <a href="{{ url_for('dq_run', dataset=dataset) }}" class="btn btn-warning btn-lg">Run DQ Rules</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
